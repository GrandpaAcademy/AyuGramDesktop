name: Linux Build

on:
  push:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build in Docker
        run: |
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            -e CONFIG=Release \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${{ secrets.API_ID || '2040' }} \
            -D TDESKTOP_API_HASH=${{ secrets.API_HASH || 'b18441a1ff607e10a989891a5462e627' }}

      - name: Strip binary
        run: strip out/Release/Telegram || true

      - uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux
          path: out/Release/Telegram
